<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yotofy - Spotify to Yoto Sync</title>
    <meta name="description" content="A concept tool to visualize syncing Spotify playlists to Yoto cards, leveraging Gemini to generate custom pixel art icons for your physical cards." />
    <meta property="og:title" content="Yotofy - Spotify to Yoto Sync" />
    <meta property="og:description" content="A concept tool to visualize syncing Spotify playlists to Yoto cards, leveraging Gemini to generate custom pixel art icons for your physical cards." />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              spotify: {
                green: '#1DB954',
                black: '#191414',
                dark: '#121212',
                light: '#282828',
              },
              yoto: {
                orange: '#FF6D00',
                red: '#FF4500',
                cream: '#F5F5F5',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            gridTemplateColumns: {
              '16': 'repeat(16, minmax(0, 1fr))',
            },
            gridTemplateRows: {
              '16': 'repeat(16, minmax(0, 1fr))',
            },
          },
        },
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #191414;
      }
      /* Custom scrollbar for playlist */
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #888;
        border-radius: 3px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #555;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
