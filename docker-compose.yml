services:
  yotofy:
    image: ghcr.io/pdilione/yotofy:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yotofy-stack
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - API_PORT=8000
      - AUDIO_DIR=/music
      - DATA_DIR=/data
      - STATE_FILE_PATH=/data/state.json
      - SPOTIFY_TOKEN_PATH=/data/spotify_token.json
      - YOTO_TOKEN_PATH=/data/yoto_token.json
      - ZOTIFY_CREDENTIALS_PATH=/data/credentials.json
      - FRONTEND_DIST_DIR=/app/dist
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID:-}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET:-}
      - YOTO_CLIENT_ID=${YOTO_CLIENT_ID:-}
      - YOTO_ACCESS_TOKEN=${YOTO_ACCESS_TOKEN:-}
      - YOTO_CARD_ID=${YOTO_CARD_ID:-}
    volumes:
      - ./data:/data
      - ./music:/music
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

