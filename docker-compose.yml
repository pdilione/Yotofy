services:
  yotofy:
    build:
      context: .
      dockerfile: Dockerfile
    image: yotofy:latest
    container_name: yotofy-stack
    restart: unless-stopped
    ports:
      - "${UI_PORT:-3000}:3000"   # Vite/React UI (proxies /api/* to FastAPI)
      - "${API_PORT:-8000}:8000" # FastAPI Python Backend API (backend/sync.py)
    env_file:
      - path: .env
        required: false
    environment:
      - UI_PORT=3000
      - API_PORT=8000
      - AUDIO_DIR=/music
      - DATA_DIR=/data
      - STATE_FILE_PATH=/data/state.json
      - ZOTIFY_CREDENTIALS_PATH=/data/credentials.json
      - FRONTEND_DIST_DIR=/app/dist
      - SPOTIPY_CLIENT_ID=${SPOTIPY_CLIENT_ID:-}
      - SPOTIPY_CLIENT_SECRET=${SPOTIPY_CLIENT_SECRET:-}
      - SPOTIPY_USER_ID=${SPOTIPY_USER_ID:-}
      - SPOTIPY_PLAYLIST_IDS=${SPOTIPY_PLAYLIST_IDS:-}
      - ZOTIFY_CREDENTIALS_JSON=${ZOTIFY_CREDENTIALS_JSON:-}
      - YOTO_ACCESS_TOKEN=${YOTO_ACCESS_TOKEN:-}
      - YOTO_CARD_ID=${YOTO_CARD_ID:-}
    volumes:
      # Persistent sync history/state (state.json) and Zotify credentials
      - ./data:/data
      # Persistent local MP3 music library downloaded via Zotify
      - ./music:/music
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8000/api/health && curl -sf http://127.0.0.1:3000/ > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
